site_name: VTEN CONTINU
site_description: Veille indépendante sur la cybersécurité, l'IA et l'administration des systèmes.
site_author: Jules Cochemé
site_url: https://jules-cocheme1.github.io/veille-technologique/

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share

nav:
  - Accueil: index.md
  - Axes de veille:
      - Failles & vulnérabilités: axe1-securite.md
      - IA & administration: axe2-ia-admin.md
      - IA & cybersécurité: axe3-ia-cyber.md
  - Méthodologie: a-propos.md

extra_css:
  - assets/app.css

extra_javascript:
  - assets/app.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables
