name: Déploiement Veille Technologique

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Exécution du script de veille
        run: |
          python scripts/fetch_news.py

      - name: Sauvegarde et fusion des fichiers
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.md
          git commit -m "Auto: Mise à jour du contenu des axes de veille" || echo "Aucun changement à commiter"
          git pull --rebase origin main
          git push origin main

      - name: Publication du site MkDocs
        run: |
          mkdocs gh-deploy --force
