name: Déploiement Veille Technologique

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests de la collecte RSS
        run: |
          python -m unittest discover -s tests

      - name: Exécution du script de veille
        run: |
          python scripts/fetch_news.py

      - name: Sauvegarde et fusion des fichiers
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/articles.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle publication à sauvegarder"
          else
            git commit -m "Auto: Actualisation de la veille RSS"
            git pull --rebase origin main
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publication du site MkDocs
        run: |
          mkdocs build --strict
          mkdocs gh-deploy --force
