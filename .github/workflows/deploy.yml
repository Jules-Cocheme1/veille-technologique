name: Déploiement Veille Technologique

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Exécution automatique tous les jours à 8h00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Exécution de la veille automatique (Python)
        run: |
          python scripts/fetch_news.py

      - name: Publication du site MkDocs sur GitHub Pages
        run: |
          mkdocs gh-deploy --force
